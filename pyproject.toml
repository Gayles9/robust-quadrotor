[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robust-quadrotor"
version = "0.1.0"
description = "Mathematical foundations for a robust autonomous quadrotor."
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1,<3",
]

[dependency-groups]
dev = [
    "matplotlib>=3.10,<4",
    "mypy>=1.15,<2",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[tool.uv]
required-version = "==0.12.3"

[tool.hatch.build.targets.wheel]
packages = ["src/quadrotor_math"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "--strict-config",
    "--strict-markers",
]
testpaths = ["tests"]
pythonpath = ["."]
xfail_strict = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
